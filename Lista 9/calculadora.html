<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="/calculadora.css">
</head>
<body>

    <div class="calculadora">

        <div class="visor"></div>

        <div class="botoes">

            <button>♪</button>
            <button>MRC</button>
            <button>M-</button>
            <button>M+</button>
            <button>÷</button>

            <button>√</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>×</button>

            <button>%</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>

            <button class="vermelho">CE</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="mais">+</button>

            <button class="vermelho">ON/C</button>
            <button>0</button>
            <button>•</button>
            <button>=</button>

        </div>

    </div>

</body>
</html>
