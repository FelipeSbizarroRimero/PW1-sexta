<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wardiere Inc. - Clone de Layout</title>
    <!-- Link para a biblioteca de Ícones Font Awesome (Versão 6 Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Vinculação com o arquivo de estilos externo -->
    <link rel="stylesheet" href="/land-page.css">
</head>
<body>

    <!-- CONTAINER PRINCIPAL: Envolve tudo e dita a largura máxima da página -->
    <div class="container">
        
        <!-- HEADER: Fora do card interno para pegar o fundo escuro geral -->
        <header class="navbar">
            <div class="logo">
                <!-- A imagem já contém o ícone e o texto "Wardiere Inc." juntos -->
                <img src="/assets/logo.png" alt="Wardiere Inc.">
            </div>
            <nav class="nav-links">
                <a href="#">Solutions</a>
                <a href="#">Pricing</a>
                <a href="#">About</a>
            </nav>
            <div class="nav-button">
                <a href="#" class="btn-signup">Sign up <i class="fa-solid fa-arrow-right"></i></a>
            </div>
        </header>

        <!-- MAIN: Este é o card interno com as bordas arredondadas e a cor diferenciada -->
        <main class="hero-card">
            <!-- Lado Esquerdo: Textos e Botão de Chamada -->
            <div class="hero-content">
                <span class="badge">#flexiblesolutions</span>
                <h1>Flexible Solutions for Your Business</h1>
                <p>Lorem ipsum praesent ac massa at ligula reet est iaculis. Vivamus est mist aliquet elit ac nisl. Lorem ipsum praesent ac massa at ligula reet est iaculis. Vivamus est mist.</p>
                <a href="#" class="btn-cta">Start free today <i class="fa-solid fa-arrow-right"></i></a>
            </div>
            
            <!-- Lado Direito: Espaço para o banner -->
            <div class="hero-image">
                <img src="/assets/banner.png" alt="Notebook Banner">
            </div>
        </main>

    </div>

</body>
</html>
